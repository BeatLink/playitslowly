# Builds the deb, rpm, Flatpak and AppImage, starts each on a test tone, and attaches them to a release for v* tags.
name: Packages

on:
  push:
    branches: [master, "worktree-*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential debhelper dh-python devscripts xvfb
      - name: Build
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist && mv ../playitslowly_*.deb dist/
      - name: Install and start
        run: |
          sudo apt-get install -y ./dist/playitslowly_*.deb
          packaging/smoke-test.sh playitslowly
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  rpm:
    runs-on: ubuntu-24.04
    container: fedora:43
    steps:
      - name: Install build tools
        run: dnf install -y git rpm-build make python3-devel desktop-file-utils libappstream-glib xorg-x11-server-Xvfb xvfb-run
      - uses: actions/checkout@v4
      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make dist
          mkdir -p ~/rpmbuild/SOURCES dist
          mv playitslowly-*.tar.gz ~/rpmbuild/SOURCES/
          rpmbuild -ba packaging/rpm/playitslowly.spec
          cp ~/rpmbuild/RPMS/noarch/*.rpm dist/
      - name: Install and start
        run: |
          dnf install -y ./dist/*.rpm
          packaging/smoke-test.sh playitslowly
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm

  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: playitslowly.flatpak
          manifest-path: packaging/flatpak/ch.x29a.playitslowly.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - name: Install and start
        run: |
          # The container has no machine id, which flatpak run needs.
          [ -s /etc/machine-id ] || tr -d - < /proc/sys/kernel/random/uuid > /etc/machine-id
          flatpak install --user -y --noninteractive --bundle playitslowly.flatpak
          # GNOME 50 decodes icons in a nested sandbox, which this container cannot create, so the window
          # cannot open here; check the audio pipeline headlessly inside the installed Flatpak instead.
          flatpak run --filesystem="$GITHUB_WORKSPACE" --command=python3 ch.x29a.playitslowly "$GITHUB_WORKSPACE/packaging/check-pipeline.py"

  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install appimage-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-pip patchelf desktop-file-utils libgdk-pixbuf2.0-dev fakeroot squashfs-tools strace gtk-update-icon-cache zsync xvfb
          # Its own environment, since it needs an older "packaging" than Ubuntu ships.
          python3 -m venv ~/appimage-builder
          ~/appimage-builder/bin/pip install appimage-builder==1.1.0 "packaging<22"
          echo ~/appimage-builder/bin >> "$GITHUB_PATH"
      - name: Build
        run: |
          export APP_VERSION=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' playitslowly/app.py)
          appimage-builder --recipe packaging/appimage/AppImageBuilder.yml --skip-test --skip-appimage
          # appimage-builder 1.1.0 writes the loader path as a Python set, which AppRun cannot use.
          sed -i "s/^APPDIR_LIBC_LINKER_PATH={'\(.*\)'}$/APPDIR_LIBC_LINKER_PATH=\1/" AppDir/AppRun.env
          grep LINKER AppDir/AppRun.env
          appimage-builder --recipe packaging/appimage/AppImageBuilder.yml --skip-script --skip-build --skip-test
          mkdir -p dist && mv ./*.AppImage dist/
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage
      - name: Start
        run: SMOKE_TIMEOUT=90 packaging/smoke-test.sh dist/*.AppImage --appimage-extract-and-run

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, rpm, flatpak, appimage]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
